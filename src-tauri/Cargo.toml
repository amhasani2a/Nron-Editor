[package]
name = "nron-editor"
version = "0.1.4"
description = "Nron Editor — a fast, offline-first RTL writing studio"
authors = ["Nron"]
edition = "2021"
rust-version = "1.90"

# The library is required for the Tauri v2 mobile (Android/iOS) entry point.
[lib]
name = "nron_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dependencies.tauri-plugin-opener]
version = "2"

[profile.release]
opt-level = "s"     # optimize for small, fast binaries on mobile
lto = true
codegen-units = 1
panic = "abort"
strip = true
