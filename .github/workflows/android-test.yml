name: Android test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci && npm run vendor && npm test
      - run: npm run tauri -- android init --ci && node tools/android-config.cjs && npm run tauri -- icon src-tauri/icons/icon.png
      - run: npm run tauri -- android build --apk --target aarch64 --debug
      - uses: actions/upload-artifact@v4
        with:
          name: nron-arm64-test-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/**debug.apk
          if-no-files-found: error
