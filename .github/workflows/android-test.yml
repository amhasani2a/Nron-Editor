name: Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # پکیج قدیمی tools توسط گوگل حذف شده؛ فقط platform-tools باید نصب شود
          packages: 'platform-tools'

      - name: Install NDK & Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust toolchain for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install NPM packages & prepare vendor bundle
        run: npm ci && npm run vendor

      - name: Initialize Tauri Android & apply config
        run: |
          npm run tauri -- android init --ci
          node tools/android-config.cjs
          chmod +x src-tauri/gen/android/gradlew
          npm run tauri -- icon src-tauri/icons/icon.png

      - name: Build Android Debug APK (ARM64)
        run: npm run tauri -- android build --apk --target aarch64 --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nron-arm64-test-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/**debug.apk
          if-no-files-found: error
