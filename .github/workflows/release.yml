name: Build Nron Editor (Windows + Android)

# Runs when you push a version tag (e.g. v1.0.0) or trigger it manually from the
# Actions tab. Both jobs compile the Rust core and upload installable artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------- WINDOWS -----------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Windows app (msi + nsis)
        run: cargo tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nron-editor-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ----------------------------- ANDROID -----------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125" "platform-tools" "platforms;android-34"

      - name: Setup Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Export NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Initialize Android project
        run: cargo tauri android init

      - name: Build Android APK (arm64 only — modern phones)
        run: cargo tauri android build --apk --target aarch64

      - name: Sign APK (self-signed so it installs on a real device)
        run: |
          KS="$RUNNER_TEMP/nron.keystore"
          keytool -genkeypair -v -keystore "$KS" -alias nron \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nron12345 -keypass nron12345 \
            -dname "CN=Nron Editor, O=Nron, L=Tehran, C=IR"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "Using build-tools: $BT"
          UNSIGNED="$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -n1)"
          echo "Unsigned APK: $UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" nron-editor-arm64.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:nron12345 --key-pass pass:nron12345 nron-editor-arm64.apk
          "$BT/apksigner" verify --verbose nron-editor-arm64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: nron-editor-android
          path: nron-editor-arm64.apk

  # ----------------------------- RELEASE -----------------------------
  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
